# Two replicas help rolling updates; one PC is still a single point of failure.
replicaCount: 2
springProfile: prod
resources:
  requests: {cpu: 200m, memory: 384Mi}
  limits: {cpu: "1", memory: 1Gi}
podDisruptionBudget:
  enabled: true
  minAvailable: 1
imagePullSecrets:
 - name: ghcr-pull
