version: 2
updates:
  - package-ecosystem: github-actions
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
  - package-ecosystem: docker
    directory: /.github/docker
    schedule: {interval: weekly}
    open-pull-requests-limit: 3
  - package-ecosystem: maven
    directory: /
    schedule: {interval: weekly}
    open-pull-requests-limit: 5
